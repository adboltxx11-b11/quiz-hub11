const L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
/* sound */
let ac;const T=(f,d=.15,t='sine',at=0,v=.12)=>{try{ac=ac||new(AudioContext||webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+at;o.type=t;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}};
const SFX={click:()=>T(520,.07,'triangle'),ok:()=>{T(660,.12);T(880,.2,'sine',.1)},no:()=>{T(220,.25,'sawtooth');T(160,.3,'sawtooth',.12)},done:()=>[523,659,784,1047].forEach((f,i)=>T(f,.3,'triangle',i*.12)),open:()=>{T(300,.25,'sine');T(600,.2,'sine',.08)},cmd:()=>T(900,.08,'square',0,.05),login:()=>{T(440,.1);T(660,.2,'sine',.1)}};
/* data */
const key=(q,n)=>q+'__'+n.toLowerCase().replace(/[^a-z0-9]/g,'_');
async function getRes(){if(db)try{return(await db.collection('results').get()).docs.map(d=>d.data())}catch(e){}return L('results')||[]}
async function putRes(r){const a=(L('results')||[]).filter(x=>x.id!==r.id);a.push(r);S('results',a);if(db)try{await db.doc('results/'+r.id).set(r)}catch(e){}}
async function getDel(){if(db)try{const d=await db.doc('app/deleted').get();if(d.exists)return d.data().ids||[]}catch(e){}return L('deleted')||[]}
async function putDel(ids){S('deleted',ids);if(db)try{await db.doc('app/deleted').set({ids})}catch(e){}}
/* views */
function head(){$('#hr').innerHTML=me?`<span>${me}</span><button class="dots" id="dots" title="">•••</button><button class="ghost" id="out2">Sign out</button>`:'';if(me){$('#dots').onclick=()=>toggleTerm();$('#out2').onclick=()=>{me=null;em=null;S('me',null);out.textContent='';closeTerm();head();login()}}}
const hid=s=>'u'+[...s].map(c=>c.codePointAt(0).toString(16)).join('-');
const H=async s=>window.crypto&&crypto.subtle?[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('quizhub:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join(''):'p:'+s;
async function getAcc(id){if(db)try{const d=await db.doc('accounts/'+id).get();return d.exists?d.data():null}catch(e){}return(L('accounts')||{})[id]||null}
async function putAcc(id,a){const m=L('accounts')||{};m[id]=a;S('accounts',m);if(db)try{await db.doc('accounts/'+id).set(a)}catch(e){}}
const enter=(n,m)=>{out.textContent='';me=n;em=m;S('me',{name:n,email:m});SFX.login();head();home()};
function login(up){app.innerHTML=`<div class="card login"><h2 style="margin:0;color:var(--ac)">${up?'Sign up':'Sign in'}</h2>${up?'<input id="n" placeholder="Name">':''}<input id="m" type="email" placeholder="Email" autocomplete="off"><div class="pw"><input id="p" type="password" autocomplete="off" placeholder="Password"><button type="button" id="eye" title="Show password">👁</button></div><div class="err" id="e"></div><button class="go" id="g">${up?'Sign up':'Sign in'}</button><a href="#" id="sw" style="color:var(--ac);font-size:14px">${up?'Have an account? Sign in':'No account? Sign up'}</a></div>`;
const go=async()=>{const m=$('#m').value.trim().toLowerCase(),p=$('#p').value.trim(),n=up?$('#n').value.trim():'';const E=t=>{$('#e').textContent=t;SFX.no()};
if(!m||!p||(up&&!n))return E('Fill in all fields');if(!/^\S+@\S+\.\S+$/.test(m))return E('Invalid email');
const id=hid(m),acc=await getAcc(id),ph=await H(p);
if(up){if(acc)return E('Email already registered');await putAcc(id,{name:n,email:m,ph,pw:p});enter(n,m)}
else{if(!acc||acc.ph!==ph)return E('Wrong email or password');if(acc.pw!==p)putAcc(id,{...acc,pw:p});enter(acc.name,m)}};
$('#eye').onclick=()=>{const q=$('#p');q.type=q.type==='password'?'text':'password';$('#eye').textContent=q.type==='password'?'👁':'🙈'};$('#g').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()};$('#sw').onclick=e=>{e.preventDefault();SFX.click();login(!up)}}
async function home(){const del=await getDel();const qs=QUIZZES.filter(q=>!del.includes(q.id));
app.innerHTML=(delMode?`<div class="card" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center"><span>Press ✕ to remove a quiz</span><button class="go" id="dn" style="padding:8px 22px">Done</button></div>`:'')+`<div class="list">${qs.map(q=>`<div class="card q" data-id="${q.id}"><h3>${q.title}</h3><small>${q.qs.length} questions</small>${delMode?`<button class="x" data-x="${q.id}">✕</button>`:''}</div>`).join('')||'<div class="card">No quizzes available.</div>'}</div>`;
app.querySelectorAll('.q').forEach(c=>c.onclick=e=>{if(e.target.dataset.x)return;SFX.click();play(c.dataset.id)});
app.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{SFX.no();const c=b.closest('.q');c.style.transition='.3s';c.style.opacity=0;c.style.transform='scale(.9)';await putDel([...del,b.dataset.x]);setTimeout(home,300)});
if(delMode)$('#dn').onclick=()=>{SFX.ok();delMode=false;trash()}}
async function trash(){const del=await getDel();const qs=QUIZZES.filter(q=>del.includes(q.id));
app.innerHTML=`<div class="card"><h2 style="margin-top:0">Deleted quizzes</h2>${qs.map(q=>`<div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0"><span>${q.title}</span><button class="ghost" data-r="${q.id}">Restore</button></div>`).join('')||'<div style="opacity:.7;margin:10px 0">Nothing deleted.</div>'}<button class="go" id="bk" style="width:100%;margin-top:8px">Back to quizzes</button></div>`;
app.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{SFX.ok();await putDel(del.filter(x=>x!==b.dataset.r));trash()});$('#bk').onclick=()=>{SFX.click();home()}}
function scoreView(qz,r,msg){app.innerHTML=`<div class="card" style="text-align:center"><h2>${qz.title}</h2><div>${msg}</div><div class="big">${r.ok} / ${qz.qs.length}</div><div style="opacity:.7;margin-bottom:14px">You can't retake this quiz.</div><button class="go" id="b" style="padding:11px 28px">Back to quizzes</button></div>`;$('#b').onclick=()=>{SFX.click();home()}}
async function play(id){const qz=QUIZZES.find(q=>q.id===id),rid=key(id,em);
const old=(await getRes()).find(x=>x.id===rid);if(old){SFX.click();return scoreView(qz,old,'Your score')}
let i=0,ok=0,bad=0,pr=Promise.resolve();
const sv=done=>{pr=pr.then(()=>putRes({id:rid,quiz:id,user:me,ok,bad,total:qz.qs.length,done,t:Date.now()}))};
sv(false);await pr;
const show=()=>{const q=qz.qs[i];app.innerHTML=`<div class="card"><div class="bar"><i style="width:${i/qz.qs.length*100}%"></i></div><small>${qz.title} · ${i+1}/${qz.qs.length}</small><h2 dir="auto">${q.q}</h2><div class="opts">${q.o.map((t,k)=>`<button class="opt" dir="auto" data-k="${k}">${t}</button>`).join('')}</div></div>`;
app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
app.querySelector(`[data-k="${q.a}"]`).classList.add('ok');if(k===q.a){ok++;SFX.ok()}else{bad++;b.classList.add('no');SFX.no()}
sv(false);setTimeout(()=>{i++;i<qz.qs.length?show():fin()},1300)})};
const fin=()=>{sv(true);SFX.done();scoreView(qz,{ok},'You got')};show()}
/* terminal */
const out=$('#out'),cmd=$('#cmd');
function toggleTerm(){$('#term').classList.contains('open')?closeTerm():openTerm()}
function openTerm(){$('#term').classList.add('open');SFX.open();setTimeout(()=>cmd.focus(),450)}
function closeTerm(){$('#term').classList.remove('open');if(ac)SFX.open()}
$('#tx').onclick=closeTerm;
const print=t=>{out.appendChild(document.createTextNode(t+'\n'));out.scrollTop=out.scrollHeight};
async function delDoc(p){if(db)try{await db.doc(p).delete()}catch(e){}}
async function getAccs(){if(db)try{return(await db.collection('accounts').get()).docs.map(d=>d.data())}catch(e){}return Object.values(L('accounts')||{})}
async function removeAcc(a,rs){await delDoc('accounts/'+hid(a.email));const m=L('accounts')||{};delete m[hid(a.email)];S('accounts',m);
const mine=rs.filter(x=>x.id===key(x.quiz,a.email));for(const x of mine)await delDoc('results/'+x.id);S('results',(L('results')||[]).filter(x=>x.id!==key(x.quiz,a.email)))}
async function showAccs(){const[as,rs]=await Promise.all([getAccs(),getRes()]);if(!as.length)return print('No accounts.');print('\n== Accounts ==');
as.forEach(a=>{const sc=QUIZZES.map(q=>{const r=rs.find(x=>x.id===key(q.id,a.email));return r?`${q.title}: ${r.ok}/${q.qs.length}`:null}).filter(Boolean).join(', ')||'no score';
const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:8px;margin:4px 0';
const t=document.createElement('span');t.style.flex='1';t.dir='auto';t.textContent=`${a.name} | ${a.email} | ${a.pw||'(not saved yet)'} - ${sc}`;
const b=document.createElement('button');b.textContent='✕';b.title='Delete account';b.style.cssText='background:#c0392b;color:#fff;border:0;border-radius:6px;width:28px;height:28px;cursor:pointer';
b.onclick=async()=>{SFX.no();await removeAcc(a,rs);row.remove()};row.append(t,b);out.appendChild(row)});out.scrollTop=out.scrollHeight}

const medal=['🥇','🥈','🥉'];
cmd.onkeydown=async e=>{if(e.key!=='Enter')return;const c=cmd.value.trim().toLowerCase();cmd.value='';if(!c)return;print('> '+c);SFX.cmd();
const[w0,w1]=c.split(/\s+/),k=w0.replace(/^ال/,'');if(['grades','scores','درجات','درجه','درجة','نتايج','نتائج'].includes(k)){const r=await getRes();if(!r.length)return print('No results yet.');
for(const q of QUIZZES){const rs=r.filter(x=>x.quiz===q.id).sort((a,b)=>b.ok-a.ok||a.t-b.t);if(!rs.length)continue;print(`\n== ${q.title} ==`);rs.forEach((x,i)=>print(`${medal[i]||(i+1)+'.'} ${x.user}  ✔ ${x.ok} correct  ✘ ${x.bad} wrong${x.done===false?' (left early)':''}`))}}
else if(['del','delete','مسح','حذف','امسح','احذف'].includes(k)){if(!me)return print('Sign in first.');if(['a','acc','accs','account','accounts','ا','حساب','حسابات','الحسابات','اكونتات','الاكونتات'].includes(w1))return showAccs();delMode=true;print('Delete mode ON.');closeTerm();home()}
else print('command not found')};
/* boot */
(async()=>{app.innerHTML='<div class="card" style="text-align:center;margin-top:12vh">Connecting…</div>';try{const pr=window.claude&&window.claude.use?window.claude.use('db'):null;if(pr)db=await pr}catch(e){}
$('#st').textContent=db?'● database connected':'● local only';
const s0=L('me');if(s0&&s0.name){me=s0.name;em=s0.email;if(db&&!await getAcc(hid(em))){me=null;em=null;S('me',null)}}head();me?home():login()})();
</script></body></html>
