<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Titus Class — Sunday School Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #eab308;
      --gold-light: #fde047;
      --gold-dark: #ca8a04;
      --glass-bg: rgba(18, 16, 14, 0.72);
      --glass-card: rgba(26, 22, 18, 0.78);
      --glass-border: rgba(234, 179, 8, 0.28);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --green: #16a34a;
      --green-bg: rgba(22, 163, 74, 0.24);
      --red: #dc2626;
      --red-bg: rgba(220, 38, 38, 0.24);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    input, button {
      font-family: inherit;
    }

    input {
      user-select: text;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      background-color: #0d0b09;
      background-image: linear-gradient(rgba(10, 8, 6, 0.62), rgba(10, 8, 6, 0.72)), url("");
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Header */
    .topbar {
      width: 100%;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(14, 12, 10, 0.68);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      background: linear-gradient(135deg, #fffbeb 0%, #facc15 65%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .db-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e2e8f0;
    }

    .db-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }

    .db-badge.connected .db-dot {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .db-badge.local .db-dot {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-chip {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fef08a;
      background: rgba(234, 179, 8, 0.14);
      border: 1px solid rgba(234, 179, 8, 0.32);
      padding: 6px 12px;
      border-radius: 999px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(234, 179, 8, 0.32);
      color: #fef9c3;
      height: 38px;
      min-width: 38px;
      padding: 0 12px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .icon-btn:hover {
      background: rgba(234, 179, 8, 0.22);
      transform: translateY(-1px);
    }

    .dots-btn {
      letter-spacing: 2px;
      font-size: 1.1rem;
      padding: 0 14px;
    }

    /* Terminal Slide-Down Overlay */
    .terminal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(4px);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.32s ease;
    }

    .terminal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .terminal-drawer {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translate(-50%, -105%);
      width: min(680px, 94vw);
      max-height: 84vh;
      display: flex;
      flex-direction: column;
      border-radius: 0 0 24px 24px;
      border: 1px solid rgba(234, 179, 8, 0.38);
      border-top: none;
      background-color: #120f0c;
      background-image: linear-gradient(rgba(12, 10, 8, 0.78), rgba(12, 10, 8, 0.86)), url("");
      background-size: cover;
      background-position: center top;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
      z-index: 100;
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }

    .terminal-drawer.open {
      transform: translate(-50%, 0);
    }

    .terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(0, 0, 0, 0.45);
      border-bottom: 1px solid rgba(234, 179, 8, 0.22);
    }

    .terminal-dots {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .terminal-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
    }

    .terminal-close {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .terminal-close:hover {
      background: rgba(220, 38, 38, 0.35);
      border-color: rgba(220, 38, 38, 0.6);
    }

    .terminal-body {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .terminal-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(0, 0, 0, 0.52);
      border: 1px solid rgba(234, 179, 8, 0.35);
      border-radius: 14px;
      padding: 6px 10px 6px 14px;
    }

    .terminal-prompt {
      color: var(--gold-light);
      font-weight: 800;
      font-size: 1rem;
    }

    .terminal-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1rem;
      padding: 8px 4px;
      direction: auto;
    }

    .terminal-run-btn {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #14110e;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      transition: transform 0.18s ease;
    }

    .terminal-run-btn:hover {
      transform: scale(1.03);
    }

    .terminal-output {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 52vh;
      overflow-y: auto;
    }

    .term-msg {
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.92rem;
      color: #e2e8f0;
    }

    .term-msg.error {
      border-color: rgba(239, 68, 68, 0.45);
      background: rgba(220, 38, 38, 0.16);
      color: #fecaca;
    }

    .grade-row, .acc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(18, 15, 12, 0.72);
      border: 1px solid rgba(234, 179, 8, 0.22);
    }

    .grade-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rank-badge {
      min-width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(234, 179, 8, 0.16);
      border: 1px solid rgba(234, 179, 8, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      color: #fef08a;
    }

    .grade-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .stat-correct {
      background: rgba(22, 163, 74, 0.25);
      border: 1px solid rgba(34, 197, 94, 0.45);
      color: #86efac;
    }

    .stat-wrong {
      background: rgba(220, 38, 38, 0.25);
      border: 1px solid rgba(248, 113, 113, 0.45);
      color: #fca5a5;
    }

    .stat-early {
      background: rgba(245, 158, 11, 0.22);
      border: 1px solid rgba(251, 191, 36, 0.45);
      color: #fde68a;
    }

    .del-acc-btn {
      background: rgba(220, 38, 38, 0.24);
      border: 1px solid rgba(248, 113, 113, 0.5);
      color: #fecaca;
      padding: 6px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .del-acc-btn:hover {
      background: rgba(220, 38, 38, 0.48);
    }

    /* Main Container */
    .main-wrap {
      flex: 1;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 18px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .glass-panel {
      width: 100%;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      padding: 30px 26px;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.58);
      animation: fadeSlideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Auth Card */
    .auth-card {
      max-width: 440px;
      margin: 0 auto;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(0, 0, 0, 0.42);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 22px;
    }

    .auth-tab {
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .auth-tab.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #14110e;
      box-shadow: 0 4px 14px rgba(234, 179, 8, 0.32);
    }

    .auth-heading {
      text-align: center;
      font-size: 1.65rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: #fef9c3;
    }

    .auth-sub {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      color: #fde68a;
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .text-input {
      width: 100%;
      padding: 13px 15px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: 0.96rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .text-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.18);
    }

    .password-input {
      padding-right: 46px;
    }

    .eye-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 8px;
      transition: color 0.2s ease;
    }

    .eye-btn:hover {
      color: var(--gold-light);
    }

    .primary-btn {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%);
      color: #14110e;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 10px 24px rgba(202, 138, 4, 0.34);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(202, 138, 4, 0.45);
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status-banner {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .status-banner.error {
      display: block;
      background: rgba(220, 38, 38, 0.22);
      border: 1px solid rgba(248, 113, 113, 0.45);
      color: #fecaca;
    }

    .status-banner.success {
      display: block;
      background: rgba(22, 163, 74, 0.22);
      border: 1px solid rgba(74, 222, 128, 0.45);
      color: #bbf7d0;
    }

    /* Dashboard / Quiz List */
    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .dash-title {
      font-size: 1.55rem;
      font-weight: 800;
      color: #fef9c3;
    }

    .del-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(220, 38, 38, 0.18);
      border: 1px solid rgba(248, 113, 113, 0.4);
      margin-bottom: 18px;
      justify-content: space-between;
    }

    .done-btn {
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 18px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.18s ease;
    }

    .done-btn:hover {
      transform: scale(1.04);
    }

    .quiz-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .quiz-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 22px;
      border-radius: 20px;
      background: var(--glass-card);
      border: 1px solid rgba(234, 179, 8, 0.28);
      cursor: pointer;
      transition: all 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .quiz-card:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
      background: rgba(34, 28, 22, 0.88);
    }

    .quiz-card-info h3 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fef08a;
      margin-bottom: 4px;
    }

    .quiz-card-info p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .quiz-badge {
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      background: rgba(234, 179, 8, 0.18);
      border: 1px solid rgba(234, 179, 8, 0.4);
      color: #fef08a;
      white-space: nowrap;
    }

    .quiz-badge.completed {
      background: rgba(22, 163, 74, 0.22);
      border-color: rgba(74, 222, 128, 0.45);
      color: #86efac;
    }

    .quiz-del-x {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(220, 38, 38, 0.85);
      border: 1px solid #fca5a5;
      color: #fff;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s ease;
    }

    .quiz-del-x:hover {
      transform: scale(1.1);
    }

    .restore-box {
      margin-top: 22px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(234, 179, 8, 0.25);
    }

    .restore-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .restore-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      margin-bottom: 8px;
    }

    .restore-btn {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #14110e;
      border: none;
      border-radius: 9px;
      padding: 6px 14px;
      font-weight: 800;
      font-size: 0.84rem;
      cursor: pointer;
    }

    /* Active Quiz View */
    .quiz-top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .arabic-question {
      direction: rtl;
      text-align: right;
      font-family: 'Cairo', sans-serif;
      font-size: 1.38rem;
      font-weight: 800;
      line-height: 1.65;
      color: #ffffff;
      margin-bottom: 22px;
      padding: 16px 18px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.35);
      border-right: 4px solid var(--gold);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      direction: rtl;
      text-align: right;
      font-family: 'Cairo', sans-serif;
      width: 100%;
      padding: 15px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: #f8fafc;
      font-size: 1.08rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--gold);
      background: rgba(234, 179, 8, 0.14);
      transform: translateX(-3px);
    }

    .option-btn.correct {
      background: var(--green-bg);
      border-color: #22c55e;
      color: #bbf7d0;
    }

    .option-btn.wrong {
      background: var(--red-bg);
      border-color: #ef4444;
      color: #fecaca;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .quiz-footer-actions {
      margin-top: 22px;
      display: flex;
      justify-content: flex-end;
    }

    /* Score View */
    .score-card {
      text-align: center;
      padding: 16px 8px;
    }

    .score-crown {
      font-size: 3.2rem;
      margin-bottom: 10px;
    }

    .score-heading {
      font-size: 1.7rem;
      font-weight: 800;
      color: #fef08a;
      margin-bottom: 12px;
    }

    .score-fraction {
      display: inline-block;
      font-size: 2.8rem;
      font-weight: 800;
      padding: 14px 34px;
      border-radius: 22px;
      background: rgba(234, 179, 8, 0.16);
      border: 1px solid rgba(234, 179, 8, 0.42);
      color: #ffffff;
      margin: 10px 0 16px;
    }

    .score-note {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 24px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="topbar">
    <div class="brand-area">
      <div class="brand-title">Titus Class</div>
      <div id="dbBadge" class="db-badge">
        <span class="db-dot"></span>
        <span id="dbStatusText">connecting...</span>
      </div>
    </div>

    <div class="top-actions">
      <span id="userChip" class="user-chip hidden"></span>
      <button id="soundToggleBtn" class="icon-btn" title="Toggle Sound" aria-label="Toggle Sound">🔊</button>
      <button id="logoutBtn" class="icon-btn hidden" title="Sign Out" aria-label="Sign Out">Exit</button>

    function getAudioCtx() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, type, duration, delay = 0, vol = 0.14) {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const startTime = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(vol, startTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    }

      const enc = new TextEncoder().encode(password);
      const buf = await crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }

            const userObj = created[0];
            setLocal(LOCAL_KEYS.accounts, [
              ...getLocal(LOCAL_KEYS.accounts, []).filter(a => a.email !== email),
              userObj
            ]);
            loginSuccess(userObj);
          } else {
            const localAccs = getLocal(LOCAL_KEYS.accounts, []);
            if (localAccs.some(a => a.email === email)) {
              showBanner("This email is already registered. Please Sign In.");
              authSubmitBtn.disabled = false;
              return;
            }
            const userObj = {
              id: crypto.randomUUID(),
              full_name: fullName,
              email,
              password_hash: passwordHash
            };
            localAccs.push(userObj);
            setLocal(LOCAL_KEYS.accounts, localAccs);
            loginSuccess(userObj);
          }
        } else {
          // Sign In
          let foundUser = null;
          if (dbConnected) {
            const rows = await sbFetch(`quiz_accounts?email=eq.${encodeURIComponent(email)}&select=*`);
            if (rows.length > 0) foundUser = rows[0];
          }
          if (!foundUser) {
            const localAccs = getLocal(LOCAL_KEYS.accounts, []);
            foundUser = localAccs.find(a => a.email === email) || null;
          }

          if (!foundUser || foundUser.password_hash !== passwordHash) {
            sfx.wrong();
            showBanner("Wrong email or password.");
            authSubmitBtn.disabled = false;
            return;
          }
          loginSuccess(foundUser);
        }
      } catch (err) {
        console.error(err);
        showBanner("Connection error. Please try again.");
      } finally {
        authSubmitBtn.disabled = false;
      }
    });

    function loginSuccess(user) {
      currentUser = { id: user.id, full_name: user.full_name, email: user.email };
      setLocal(LOCAL_KEYS.session, currentUser);
      document.getElementById("userChip").textContent = currentUser.full_name;
      document.getElementById("userChip").classList.remove("hidden");
      document.getElementById("logoutBtn").classList.remove("hidden");
      showDashboard();
    }

    function signOutUser() {
      sfx.click();
      currentUser = null;
      activeQuiz = null;
      deleteModeActive = false;
      localStorage.removeItem(LOCAL_KEYS.session);
      document.getElementById("userChip").classList.add("hidden");
      document.getElementById("logoutBtn").classList.add("hidden");
      showSection("auth");
    }

    document.getElementById("logoutBtn").addEventListener("click", signOutUser);

    // ==========================================
    // 7. VIEW ROUTING & DASHBOARD
    // ==========================================
    function showSection(name) {
      authSection.classList.add("hidden");
      dashboardSection.classList.add("hidden");
      quizSection.classList.add("hidden");
      scoreSection.classList.add("hidden");

      if (name === "auth") authSection.classList.remove("hidden");
      if (name === "dashboard") dashboardSection.classList.remove("hidden");
      if (name === "quiz") quizSection.classList.remove("hidden");
      if (name === "score") scoreSection.classList.remove("hidden");
    }

    async function showDashboard() {
      activeQuiz = null;
      showSection("dashboard");
      await loadDeletedQuizzes();
      await renderQuizGrid();
    }

    async function renderQuizGrid() {
      const grid = document.getElementById("quizGrid");
      const delToolbar = document.getElementById("delToolbar");
      grid.innerHTML = "";

      if (deleteModeActive) delToolbar.classList.remove("hidden");
      else delToolbar.classList.add("hidden");

      const visibleQuizzes = QUIZZES.filter(q => !deletedQuizIds.has(q.id));

      if (visibleQuizzes.length === 0) {
        grid.innerHTML = `<div class="term-msg" style="text-align:center;">No active quizzes available right now.</div>`;
        return;
      }

      for (const quiz of visibleQuizzes) {
        const prevResult = currentUser ? await getUserResultForQuiz(currentUser.id, quiz.id) : null;
        const card = document.createElement("div");
        card.className = "quiz-card";

        const badgeHtml = prevResult
          ? `<span class="quiz-badge completed">Completed • ${prevResult.correct_count} / ${quiz.questions.length}</span>`
          : `<span class="quiz-badge">${quiz.questions.length} Questions</span>`;

        const delBtnHtml = deleteModeActive
          ? `<button class="quiz-del-x" type="button" title="Delete Quiz">✕</button>`
          : badgeHtml;

        card.innerHTML = `
          <div class="quiz-card-info">
            <h3>${quiz.title}</h3>
            <p>${quiz.subtitle}</p>
          </div>
          <div>${delBtnHtml}</div>
        `;

        if (deleteModeActive) {
          const delBtn = card.querySelector(".quiz-del-x");
          delBtn.addEventListener("click", async (e) => {
            e.stopPropagation();
            sfx.wrong();
            await markQuizDeleted(quiz);
            await renderQuizGrid();
          });
        } else {
          card.addEventListener("click", () => handleQuizCardClick(quiz));
        }

        grid.appendChild(card);
      }
    }

    document.getElementById("delDoneBtn").addEventListener("click", () => {
      sfx.click();
      deleteModeActive = false;
      renderQuizGrid();
      renderRestorePanel();
    });

    function renderRestorePanel() {
      const panel = document.getElementById("restorePanel");
      const list = document.getElementById("restoreList");
      const deletedList = QUIZZES.filter(q => deletedQuizIds.has(q.id));

      if (deletedList.length === 0) {
        panel.classList.add("hidden");
        return;
      }

      panel.classList.remove("hidden");
      list.innerHTML = "";

      deletedList.forEach(q => {
        const row = document.createElement("div");
        row.className = "restore-item";
        row.innerHTML = `
          <span style="font-weight:700; color:#f8fafc;">${q.title}</span>
          <button class="restore-btn" type="button">Restore</button>
        `;
        row.querySelector(".restore-btn").addEventListener("click", async () => {
          sfx.correct();
          await restoreQuizById(q.id);
          renderRestorePanel();
          await renderQuizGrid();
        });
        list.appendChild(row);
      });
    }

    document.getElementById("closeRestoreBtn").addEventListener("click", () => {
      sfx.click();
      document.getElementById("restorePanel").classList.add("hidden");
    });

    // ==========================================
    // 8. QUIZ ENGINE & ANTI-RETAKE LOCK
    // ==========================================
    async function handleQuizCardClick(quiz) {
      if (!currentUser) return;
      sfx.click();

      // Check if user already started or completed this quiz
      const existing = await getUserResultForQuiz(currentUser.id, quiz.id);
      if (existing) {
        showLockedScoreScreen(existing.correct_count, quiz.questions.length);
        return;
      }

      // Immediately lock the attempt in DB as started (0 correct, all wrong if left early)
      activeQuiz = quiz;
      currentQuestionIndex = 0;
      currentCorrectCount = 0;
      currentWrongCount = 0;
      answeredCurrent = false;

      await upsertQuizResult({
        account_id: currentUser.id,
        quiz_id: quiz.id,
        quiz_title: quiz.title,
        correct_count: 0,
        wrong_count: quiz.questions.length,
        total_questions: quiz.questions.length,
        left_early: true,
        completed: false,
        updated_at: new Date().toISOString()
      });

      document.getElementById("quizTitleHeader").textContent = quiz.title;
      showSection("quiz");
      renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
      const total = activeQuiz.questions.length;
      const item = activeQuiz.questions[currentQuestionIndex];
      answeredCurrent = false;

      document.getElementById("questionCounter").textContent = `Question ${currentQuestionIndex + 1} / ${total}`;
      document.getElementById("progressFill").style.width = `${((currentQuestionIndex + 1) / total) * 100}%`;
      document.getElementById("questionText").textContent = item.q;

      const nextBtn = document.getElementById("nextQuestionBtn");
      nextBtn.classList.add("hidden");
      nextBtn.textContent = currentQuestionIndex === total - 1 ? "Finish Quiz" : "Next";

      const container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      item.options.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.innerHTML = `<span>${optText}</span><span class="opt-icon"></span>`;
        btn.addEventListener("click", () => handleAnswerSelection(idx));
        container.appendChild(btn);
      });
    }

    async function handleAnswerSelection(selectedIndex) {
      if (answeredCurrent || !activeQuiz) return;
      answeredCurrent = true;

      const item = activeQuiz.questions[currentQuestionIndex];
      const isCorrect = selectedIndex === item.answer;

      if (isCorrect) {
        currentCorrectCount++;
        sfx.correct();
      } else {
        currentWrongCount++;
        sfx.wrong();
      }

      const buttons = document.querySelectorAll("#optionsContainer .option-btn");
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        const iconSpan = btn.querySelector(".opt-icon");
        if (idx === item.answer) {
          btn.classList.add("correct");
          iconSpan.textContent = "✔";
        } else if (idx === selectedIndex && !isCorrect) {
          btn.classList.add("wrong");
          iconSpan.textContent = "✖";
        }
      });

      // Save incremental progress in case the student leaves early mid-quiz
      const total = activeQuiz.questions.length;
      const remainingUnanswered = total - (currentCorrectCount + currentWrongCount);
      await upsertQuizResult({
        account_id: currentUser.id,
        quiz_id: activeQuiz.id,
        quiz_title: activeQuiz.title,
        correct_count: currentCorrectCount,
        wrong_count: currentWrongCount + remainingUnanswered,
        total_questions: total,
        left_early: remainingUnanswered > 0,
        completed: remainingUnanswered === 0,
        updated_at: new Date().toISOString()
      });

      document.getElementById("nextQuestionBtn").classList.remove("hidden");
    }

    document.getElementById("nextQuestionBtn").addEventListener("click", async () => {
      if (!activeQuiz) return;
      sfx.click();
      const total = activeQuiz.questions.length;

      if (currentQuestionIndex < total - 1) {
        currentQuestionIndex++;
        renderCurrentQuestion();
      } else {
        // Completed all questions
        await upsertQuizResult({
          account_id: currentUser.id,
          quiz_id: activeQuiz.id,
          quiz_title: activeQuiz.title,
          correct_count: currentCorrectCount,
          wrong_count: currentWrongCount,
          total_questions: total,
          left_early: false,
          completed: true,
          updated_at: new Date().toISOString()
        });
        sfx.finish();
        const finalCorrect = currentCorrectCount;
        activeQuiz = null;
        showLockedScoreScreen(finalCorrect, total);
      }
    });

    function showLockedScoreScreen(correct, total) {
      document.getElementById("scoreFraction").textContent = `${correct} / ${total}`;
      showSection("score");
    }

    document.getElementById("backToHomeBtn").addEventListener("click", () => {
      sfx.click();
      showDashboard();
    });

    // ==========================================
    // 9. HIDDEN TERMINAL LOGIC
    // ==========================================
    const terminalToggleBtn = document.getElementById("terminalToggleBtn");
    const terminalDrawer = document.getElementById("terminalDrawer");
    const terminalBackdrop = document.getElementById("terminalBackdrop");
    const terminalCloseBtn = document.getElementById("terminalCloseBtn");
    const terminalForm = document.getElementById("terminalForm");
    const terminalInput = document.getElementById("terminalInput");
    const terminalOutput = document.getElementById("terminalOutput");

    function openTerminal() {
      sfx.terminalOpen();
      // Always start clean with NO grades or commands exposed automatically
      terminalInput.value = "";
      terminalOutput.innerHTML = "";
      terminalBackdrop.classList.add("open");
      terminalDrawer.classList.add("open");
      terminalDrawer.setAttribute("aria-hidden", "false");
      setTimeout(() => terminalInput.focus(), 180);
    }

    function closeTerminal() {
      sfx.click();
      terminalBackdrop.classList.remove("open");
      terminalDrawer.classList.remove("open");
      terminalDrawer.setAttribute("aria-hidden", "true");
    }

    terminalToggleBtn.addEventListener("click", openTerminal);
    terminalCloseBtn.addEventListener("click", closeTerminal);
    terminalBackdrop.addEventListener("click", closeTerminal);

    terminalForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const rawCmd = terminalInput.value.trim();
      if (!rawCmd) return;

      const cmd = rawCmd.toLowerCase();
      terminalOutput.innerHTML = "";

      // 1) Grades command: الدرجات / درجات / grades
      if (cmd === "الدرجات" || cmd === "درجات" || cmd === "grades") {
        sfx.terminalCmd();
        terminalOutput.innerHTML = `<div class="term-msg">Loading leaderboard...</div>`;
        const grades = await fetchAllGrades();

        if (!grades || grades.length === 0) {
          terminalOutput.innerHTML = `<div class="term-msg">No quiz scores recorded yet.</div>`;
          return;
        }

        // Sort highest correct_count first, then fewest wrong_count
        grades.sort((a, b) => {
          if (b.correct_count !== a.correct_count) return b.correct_count - a.correct_count;
          return a.wrong_count - b.wrong_count;
        });

        terminalOutput.innerHTML = "";
        grades.forEach((entry, index) => {
          const rankIcon = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `#${index + 1}`;
          const earlyTag = entry.left_early ? `<span class="stat-pill stat-early">(left early)</span>` : "";
          const row = document.createElement("div");
          row.className = "grade-row";
          row.innerHTML = `
            <div class="grade-left">
              <div class="rank-badge">${rankIcon}</div>
              <div>
                <div style="font-weight:800; color:#fff;">${escapeHtml(entry.full_name)}</div>
                <div style="font-size:0.78rem; color:#cbd5e1;">${escapeHtml(entry.quiz_title)}</div>
              </div>
            </div>
            <div class="grade-stats">
              ${earlyTag}
              <span class="stat-pill stat-correct">✔ ${entry.correct_count}</span>
              <span class="stat-pill stat-wrong">✖ ${entry.wrong_count}</span>
            </div>
          `;
          terminalOutput.appendChild(row);
        });
        return;
      }

      // 2) Delete Accounts command: del a
      if (cmd === "del a") {
        sfx.terminalCmd();
        terminalOutput.innerHTML = `<div class="term-msg">Loading accounts...</div>`;
        const accounts = await fetchAllAccountsWithScores();

        if (!accounts || accounts.length === 0) {
          terminalOutput.innerHTML = `<div class="term-msg">No registered accounts found.</div>`;
          return;
        }

        terminalOutput.innerHTML = "";
        accounts.forEach(acc => {
          const row = document.createElement("div");
          row.className = "acc-row";
          const scoreLabel = acc.attemptsCount > 0
            ? `${acc.totalCorrect} / ${acc.totalQs}`
            : "No attempts";

          row.innerHTML = `
            <div>
              <div style="font-weight:800; color:#fff;">${escapeHtml(acc.full_name)}</div>
              <div style="font-size:0.78rem; color:#cbd5e1;">${escapeHtml(acc.email)} • Score: <strong style="color:#fde047;">${scoreLabel}</strong></div>
            </div>
            <button class="del-acc-btn" type="button">✕ Delete</button>
          `;

          row.querySelector(".del-acc-btn").addEventListener("click", async () => {
            sfx.wrong();
            await deleteAccountAndScores(acc.id);
            row.remove();
            if (terminalOutput.children.length === 0) {
              terminalOutput.innerHTML = `<div class="term-msg">No registered accounts found.</div>`;
            }
          });

          terminalOutput.appendChild(row);
        });
        return;
      }

      // 3) Delete Quizzes command: del / مسح / حذف
      if (cmd === "del" || cmd === "مسح" || cmd === "حذف") {
        sfx.terminalCmd();
        closeTerminal();
        if (!currentUser) return;
        deleteModeActive = true;
        document.getElementById("restorePanel").classList.add("hidden");
        await showDashboard();
        return;
      }

      // Unknown command
      sfx.wrong();
      terminalOutput.innerHTML = `<div class="term-msg error">Command not found.</div>`;
    });

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Sound Toggle Button
    const soundToggleBtn = document.getElementById("soundToggleBtn");
    soundToggleBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundToggleBtn.textContent = soundEnabled ? "🔊" : "🔇";
      if (soundEnabled) sfx.click();
    });

    // ==========================================
    // 10. INITIALIZE APP
    // ==========================================
    (async function boot() {
      await initConnection();
      const savedSession = getLocal(LOCAL_KEYS.session, null);
      if (savedSession && savedSession.id) {
        currentUser = savedSession;
        document.getElementById("userChip").textContent = currentUser.full_name;
        document.getElementById("userChip").classList.remove("hidden");
        document.getElementById("logoutBtn").classList.remove("hidden");
        await showDashboard();
      } else {
        showSection("auth");
      }
    })();
  </script>
</body>
</html>
