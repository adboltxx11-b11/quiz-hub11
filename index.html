body::before{content:"";position:fixed;inset:0;background:rgba(8,8,14,.74);z-index:0}
header,main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:14px 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;margin:0;color:var(--g)}small{opacity:.6;font-size:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--g);color:#1a1405;font-weight:600;transition:transform .15s,opacity .15s}
button:hover{transform:translateY(-1px)}button.ghost{background:rgba(255,255,255,.12);color:var(--t)}
.card,.box{background:rgba(20,20,30,.78);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:16px;margin:10px 0;backdrop-filter:blur(4px);animation:in .35s ease}
.card{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.x{background:#c0392b;color:#fff;padding:6px 11px}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:var(--t);font:inherit}
.pw{position:relative}.pw button{position:absolute;right:4px;top:8px;background:none;color:var(--t);padding:6px 10px}
.opt{display:block;width:100%;text-align:start;margin:8px 0;background:rgba(255,255,255,.1);color:var(--t);font-weight:400}
.opt.ok{background:#1e8449}.opt.no{background:#b03a2e}
.big{font-size:44px;color:var(--g);text-align:center;margin:10px 0}.err{color:#ff8a80;min-height:20px}
a{color:var(--g);cursor:pointer}
#term{position:fixed;left:0;right:0;top:0;z-index:20;transform:translateY(-105%);transition:transform .35s ease;background:rgba(4,8,12,.97);border-bottom:2px solid var(--g);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 14px;font-family:ui-monospace,Consolas,monospace;max-height:70vh;display:flex;flex-direction:column}
#term.open{transform:none}#tout{overflow:auto;font-size:13px;line-height:1.7;min-height:90px;max-height:40vh}
#tout .r{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(255,255,255,.08);padding:3px 0}
.th{display:flex;justify-content:space-between;color:var(--g)}.th button{padding:2px 10px;background:none;color:var(--t)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

<script>
const SB_URL="https://tkrqckcycfmmnakgyvls.supabase.co",SB_KEY="sb_publishable_rXgx5qWdaIKcVykYsyLQLQ_IgKgVX3Z";
const SEED=[{id:"titus-class",title:"Titus Class",deleted:false,questions:[
{q:"من هو كاتب رسالة تيطس؟",options:["بطرس","بولس","يوحنا","تيموثاوس"],answer:1},
{q:"ما اسم الشخص الذي أرسل إليه بولس هذه الرسالة؟",options:["فيلمون","تيموثاوس","تيطس","سيلا"],answer:2},
{q:"أين ترك بولس تيطس لكي يكمل ترتيب الأمور؟",options:["أفسس","كريطة","كورنثوس","رومية"],answer:1},
{q:"الله الذي لا يكذب، متى وعد بالحياة الأبدية؟",options:["في أيام نوح","في أيام موسى","قبل الأزمنة الأزلية","بعد القيامة"],answer:2},
{q:"ما هي الصفة التي يجب أن يتحلى بها الأسقف كما في الآية 7؟",options:["مُعجب بنفسه","غضوب","ضارب","بلا لوم"],answer:3},
{q:"ما الشيء الذي لا يجب أن يكون عليه الأسقف؟",options:["مضيفاً","غضوباً","باراً","محباً للخير"],answer:1},
{q:"بحسب الآية 5، لماذا ترك بولس تيطس في كريطة؟",options:["ليبني كنيسة جديدة","ليسافر إلى رومية","ليتعلم من الشيوخ","ليكمّل ترتيب الأمور الناقصة ويقيم شيوخاً في كل مدينة"],answer:3}]}];
let mode="local",C={accounts:[],quizzes:[],results:[]},me=null,delMode=false,S=null;
const $=s=>document.querySelector(s),M=$("#main");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ac;function snd(t){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const P={click:[[600,.05]],ok:[[660,.1],[880,.15]],bad:[[220,.2],[160,.25]],end:[[523,.12],[659,.12],[784,.25]],open:[[400,.06],[600,.08]],key:[[900,.03]]}[t];let a=ac.currentTime;P.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="triangle";g.gain.setValueAtTime(.15,a);g.gain.exponentialRampToValueAtTime(.001,a+d);o.connect(g);g.connect(ac.destination);o.start(a);o.stop(a+d);a+=d})}catch(e){}}
async function sb(p,m="GET",b){const c=new AbortController(),t=setTimeout(()=>c.abort(),6000);try{const r=await fetch(SB_URL+"/rest/v1/"+p,{method:m,signal:c.signal,headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",Prefer:"return=representation"},body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(await r.text());return r.status==204?[]:await r.json()}finally{clearTimeout(t)}}
const save=()=>{if(mode=="local")try{localStorage.setItem("qh",JSON.stringify(C))}catch(e){}};
async function load(){if(mode=="sb")for(const t of["accounts","quizzes","results"])C[t]=await sb(t+"?select=*"+(t=="quizzes"?"&order=sort_order":""))}
async function ins(t,r){r.id=crypto.randomUUID();r.created_at=new Date().toISOString();if(mode=="sb")r=(await sb(t,"POST",r))[0];C[t].push(r);save();return r}
async function upd(t,id,p){if(mode=="sb")await sb(`${t}?id=eq.${id}`,"PATCH",p);Object.assign(C[t].find(x=>x.id==id),p);save()}
async function rm(t,id){if(mode=="sb")await sb(`${t}?id=eq.${id}`,"DELETE");C[t]=C[t].filter(x=>x.id!=id);if(t=="accounts")C.results=C.results.filter(r=>r.account_id!=id);save()}
async function init(){
 if(SB_URL){try{mode="sb";await load()}catch(e){mode="local"}}
 if(mode=="local"){try{C=JSON.parse(localStorage.getItem("qh"))||null}catch(e){C=null}if(!C){C={accounts:[],quizzes:JSON.parse(JSON.stringify(SEED)),results:[]};save()}}
 $("#st").textContent=mode=="sb"?"database connected":"local only";
 try{me=C.accounts.find(a=>a.id==localStorage.getItem("qh_me"))||null}catch(e){}
 go()}
function go(){hdr();me?home():auth(0)}
function hdr(){$("#hr").innerHTML=(me?`<small>${esc(me.name)}</small> <button class="ghost" onclick="out()">Sign out</button> `:"")+`<button class="ghost" onclick="tt()">•••</button>`}
function out(){me=null;try{localStorage.removeItem("qh_me")}catch(e){}$("#tout").innerHTML="";delMode=false;snd("click");go()}
function tt(f){const t=$("#term");const o=f===0?false:!t.classList.contains("open");t.classList.toggle("open",o);if(o){snd("open");setTimeout(()=>$("#tin").focus(),350)}else snd("click")}
function auth(up){M.innerHTML=`<div class="box"><h1>${up?"Sign up":"Sign in"}</h1>${up?'<input id="n" placeholder="Name">':""}<input id="e" type="email" placeholder="Email"><div class="pw"><input id="p" type="password" placeholder="Password"><button onclick="const i=$('#p');i.type=i.type=='password'?'text':'password'">👁</button></div><div class="err" id="er"></div><button onclick="doAuth(${up})">${up?"Sign up":"Sign in"}</button><p><a onclick="auth(${up?0:1})">${up?"Have an account? Sign in":"No account? Sign up"}</a></p></div>`}
async function doAuth(up){snd("click");const e=$("#e").value.trim().toLowerCase(),p=$("#p").value,n=up?$("#n").value.trim():"";const er=m=>{$("#er").textContent=m;snd("bad")};
 if(!e||!p||(up&&!n))return er("Please fill in all fields.");
 try{await load()}catch(x){return er("Can't reach the database.")}
 let a=C.accounts.find(x=>x.email.toLowerCase()==e);
 if(up){if(a)return er("Email already registered.");a=await ins("accounts",{name:n,email:e,password:p})}
 else if(!a||a.password!=p)return er("Wrong email or password.");
 me=a;try{localStorage.setItem("qh_me",a.id)}catch(x){}$("#tout").innerHTML="";snd("ok");go()}
function home(){const qs=C.quizzes.filter(q=>!q.deleted);
 M.innerHTML=`<h1>Quizzes</h1>`+(delMode?`<button onclick="trash()">Done</button>`:"")+(qs.map(q=>`<div class="card" onclick="${delMode?"":`openQ('${esc(q.id)}')`}"><div><b>${esc(q.title)}</b><br><small>${q.questions.length} questions</small></div>${delMode?`<button class="x" onclick="delQ('${esc(q.id)}')">✕</button>`:"›"}</div>`).join("")||"<p>No quizzes.</p>")}
async function delQ(id){snd("click");await upd("quizzes",id,{deleted:true});home()}
function trash(){delMode=false;snd("ok");const d=C.quizzes.filter(q=>q.deleted);
 M.innerHTML=`<h1>Deleted quizzes</h1>`+(d.map(q=>`<div class="card"><b>${esc(q.title)}</b><button onclick="restore('${esc(q.id)}')">Restore</button></div>`).join("")||"<p>Nothing deleted.</p>")+`<button class="ghost" onclick="home()">Back</button>`}
async function restore(id){snd("ok");await upd("quizzes",id,{deleted:false});trash();delMode=false}
async function openQ(id){snd("click");try{await load()}catch(e){}
 const q=C.quizzes.find(x=>x.id==id);let r=C.results.find(x=>x.account_id==me.id&&x.quiz_id==id);
 if(r)return score(q,r);
 const n=q.questions.length;r=await ins("results",{account_id:me.id,quiz_id:id,correct:0,wrong:n,total:n,finished:false});
 S={q,i:0,c:0,r};ask()}
function ask(){const{q,i}=S,Q=q.questions[i];
 M.innerHTML=`<div class="box"><small>${esc(q.title)} · ${i+1} / ${q.questions.length}</small><h2 dir="auto">${esc(Q.q)}</h2>${Q.options.map((o,k)=>`<button class="opt" dir="auto" onclick="pick(${k},this)">${esc(o)}</button>`).join("")}<div id="nx"></div></div>`}
async function pick(k,b){const Q=S.q.questions[S.i],bs=[...document.querySelectorAll(".opt")];if(bs[0].disabled)return;bs.forEach(x=>x.disabled=true);
 const ok=k==Q.answer;if(ok)S.c++;b.classList.add(ok?"ok":"no");bs[Q.answer].classList.add("ok");snd(ok?"ok":"bad");
 const n=S.q.questions.length,last=S.i==n-1;
 try{await upd("results",S.r.id,{correct:S.c,wrong:n-S.c,finished:last})}catch(e){}
 $("#nx").innerHTML=`<button onclick="nxt()">${last?"Finish":"Next"}</button>`}
function nxt(){snd("click");if(S.i<S.q.questions.length-1){S.i++;ask()}else{snd("end");M.innerHTML=`<div class="box"><p>Quiz finished!</p><div class="big">${S.c} / ${S.q.questions.length}</div><button onclick="home()">Back to quizzes</button></div>`}}
function score(q,r){M.innerHTML=`<div class="box"><h2>${esc(q.title)}</h2><p>Your score</p><div class="big">${r.correct} / ${r.total}</div><p>You can't retake this quiz.</p><button onclick="home()">Back</button></div>`}
function p(h){const o=$("#tout");o.insertAdjacentHTML("beforeend",h);o.scrollTop=o.scrollHeight}
async function run(i){const raw=i.value.trim(),c=raw.toLowerCase().replace(/\s+/g," ");i.value="";if(!c)return;snd("key");p(`<div>&gt; ${esc(raw)}</div>`);
 try{await load()}catch(e){}
 if(["grades","الدرجات","درجات"].includes(c))grades();
 else if(["del a","del accounts","مسح حسابات"].includes(c))accts();
 else if(["del","مسح","حذف"].includes(c)){if(!me){p("<div>Sign in first.</div>");return}tt(0);delMode=true;home()}
 else p("<div>not found</div>")}
function grades(){let h="";C.quizzes.filter(q=>!q.deleted).forEach(q=>{h+=`<div style="color:var(--g)"><b>${esc(q.title)}</b></div>`;const rs=C.results.filter(r=>r.quiz_id==q.id).sort((a,b)=>b.correct-a.correct);
 h+=rs.map((r,k)=>{const a=C.accounts.find(x=>x.id==r.account_id);return`<div>${["🥇","🥈","🥉"][k]||(k+1)+"."} ${esc(a?a.name:"?")} — ${r.correct} ✓ ${r.wrong} ✗${r.finished?"":" (left early)"}</div>`}).join("")||"<div>no results yet</div>"});p(h||"<div>no quizzes</div>")}
function accts(){$("#tout").innerHTML="";p(C.accounts.map(a=>{const s=C.results.filter(r=>r.account_id==a.id).map(r=>{const q=C.quizzes.find(x=>x.id==r.quiz_id);return`${esc(q?q.title:r.quiz_id)}: ${r.correct}/${r.total}`}).join(", ")||"no scores";return`<div class="r"><span>${esc(a.name)} | ${esc(a.email)} | ${esc(a.password)}<br><small>${s}</small></span><button class="x" onclick="rmAcc('${a.id}')">✕</button></div>`}).join("")||"<div>no accounts</div>")}
async function rmAcc(id){snd("click");await rm("accounts",id);if(me&&me.id==id){out();tt(0);return}accts()}
init();
</script></body></html>
